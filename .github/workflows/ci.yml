name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo test --workspace --exclude speculum-app
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true

  build:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            args: --bundles nsis,msi
            bundle_dir: target/release/bundle
            files: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - os: linux
            runner: ubuntu-latest
            args: --bundles appimage,deb
            bundle_dir: target/release/bundle
            files: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - os: macos
            runner: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            bundle_dir: target/universal-apple-darwin/release/bundle
            files: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-${{ matrix.os }}

      - name: Install Tauri system dependencies (linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils file

      - run: pnpm -C app/ui install --frozen-lockfile
      - name: Build UI
        run: pnpm -C app/ui build

      - name: Build Tauri bundles
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        working-directory: app/src-tauri
        # UI is built in the previous step; skip beforeBuildCommand (its relative path
        # depends on the CLI's working directory).
        run: ../ui/node_modules/.bin/tauri build ${{ matrix.args }} --config '{"build":{"beforeBuildCommand":""}}'

      - name: List bundles
        shell: bash
        run: find ${{ matrix.bundle_dir }} -maxdepth 2 -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: speculum-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: speculum-*
      - run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Speculum ${{ github.ref_name }}
          body: |
            Test builds of Speculum ${{ github.ref_name }}.

            - Windows: the -setup.exe (recommended) or the .msi
            - Linux: the .AppImage (chmod +x, then run) or the .deb
            - macOS: the universal .dmg (Apple Silicon + Intel). It is NOT signed:
              the first time, right-click the app > Open > Open, or allow it in
              System Settings > Privacy & Security > "Open Anyway".
              Terminal option: xattr -dr com.apple.quarantine /Applications/Speculum.app
          files: dist/**/*
          fail_on_unmatched_files: true
