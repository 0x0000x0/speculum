<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Speculum</title>
    <script>
      // Pre-paint theme so the correct tokens apply before React mounts
      // (mirrors ThemeProvider logic: ?theme override > localStorage > OS).
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var m = null;
        try {
          m = localStorage.getItem("speculum.theme");
        } catch (e) {}
        var t =
          q === "dark" || q === "light"
            ? q
            : m === "dark" || m === "light"
              ? m
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
